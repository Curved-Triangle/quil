[workspace]
members = [
    "crates/quil",
    "crates/quil-audio",
    "crates/quil-core",
    "crates/quil-inference",
    "crates/quil-model-fetch",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/permitzip/quil"
homepage = "https://github.com/permitzip/quil"

[workspace.dependencies]
quil-audio = { path = "crates/quil-audio" }
quil-core = { path = "crates/quil-core" }
quil-inference = { path = "crates/quil-inference" }

clap = { version = "=4.6.7", features = ["derive"] }
hound = "=3.5.1"
libc = "=0.2.191"
rtrb = "=0.4.1"
rubato = "=5.0.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
thiserror = "=2.0.21"
zeroize = "=1.9.1"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
