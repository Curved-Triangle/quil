[package]
name = "quil"
description = "Fully local macOS dictation CLI and benchmark harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clap.workspace = true
enigo = { version = "=0.6.1", default-features = false }
global-hotkey = "=0.9.0"
libc.workspace = true
macos-accessibility-client = "=0.0.2"
objc2-application-services = { version = "=0.3.2", features = ["AXError", "AXUIElement", "HIServices"] }
objc2-core-foundation = "=0.3.2"
winit = { version = "=0.30.13", default-features = false }
quil-audio.workspace = true
quil-core.workspace = true
quil-inference.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
